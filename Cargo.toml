[package]
name = "duckier"
version = "2.0.13"
description = "Duckier VPN CLI — headless client for Linux, macOS, and Windows"
edition = "2021"
rust-version = "1.70"
license = "GPL-3.0-only"
repository = "https://github.com/duckiercom/duckier-cli"
homepage = "https://duckier.com"
keywords = ["vpn", "wireguard", "cli", "privacy"]
categories = ["network-programming", "command-line-utilities"]

[[bin]]
name = "duckier-cli"
path = "src/main.rs"

[build-dependencies]
tonic-build = "0.12"
toml = "0.8"

[dependencies]
# gRPC
tonic = { version = "0.12", default-features = false, features = ["channel", "codegen", "prost"] }
prost = "0.13"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

# CLI
clap = { version = "4", default-features = false, features = ["derive", "help", "std", "usage"] }

# HTTP
http-body-util = "0.1"
hyper = { version = "1", default-features = false, features = ["client", "http1"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "ring", "tls12", "webpki-tokio"] }
hyper-util = { version = "0.1", default-features = false, features = ["client", "client-legacy", "http1", "tokio"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Crypto
sha2 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
base64 = "0.22"
rand = "0.8"
hex = "0.4"

# Utilities
anyhow = "1"
dirs = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
hostname = "0.4"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true
